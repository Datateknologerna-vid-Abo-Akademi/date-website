# Runs all associations simultaneously for style comparison.
# Each association gets its own web container on a dedicated port, its own
# PostgreSQL database, and its own Redis logical database, so variants do not
# collide on shared state.
#
# Usage:
#   docker compose -f docker-compose.dev-all.yml --profile all up --build
#   docker compose -f docker-compose.dev-all.yml --profile kk up --build  # one variant
#   docker compose -f docker-compose.dev-all.yml --profile all down
#
# Association ports:
#   biocum   → http://localhost:8001
#   date     → http://localhost:8002
#   kk       → http://localhost:8003
#   pulterit → http://localhost:8004
#   sf       → http://localhost:8005
#   impuls   → http://localhost:8006
#   pgAdmin  → http://localhost:5050

x-web-common: &web-common
  env_file: .env
  build: .
  restart: unless-stopped
  volumes:
    - .:/code
  command: python manage.py runserver 0.0.0.0:8000
  depends_on:
    init:
      condition: service_completed_successfully
    redis:
      condition: service_started

x-web-env: &web-env
  DATE_DEBUG: "True"
  DATE_DEVELOP: "True"

services:
  db:
    image: postgres:${DATE_POSTGRESQL_VERSION}-alpine
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /scripts/postgres-entrypoint.sh
    volumes:
      - date_postgres_data:/var/lib/postgresql/data/
      - ./scripts/postgres-entrypoint.sh:/scripts/postgres-entrypoint.sh:ro
    environment:
      POSTGRES_PASSWORD: ${DATE_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"

  # Creates one database per association so dev variants do not share rows.
  db-init:
    image: postgres:${DATE_POSTGRESQL_VERSION}-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${DATE_DB_PASSWORD}
    command: /bin/bash -c "for db in date kk biocum pulterit sf impuls demo; do psql -h db -U postgres -tc \"SELECT 1 FROM pg_database WHERE datname='${db}'\" | grep -q 1 || createdb -h db -U postgres ${db}; done"
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-password}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - dev_all_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  redis:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped
    volumes:
      - dev_all_redis_data:/data

  # Runs once: migrates each variant against its own database (so
  # association-only apps like lucia and klotterplanket get their tables),
  # then compiles translations. All web containers wait for this to finish.
  # collectstatic is skipped — WHITENOISE_USE_FINDERS=True (set when DEBUG)
  # has each container serve static files directly from its own
  # STATICFILES_DIRS.
  init:
    env_file: .env
    build: .
    restart: "no"
    command: /bin/bash -c "./wait-for-postgres.sh db:5432 && for entry in 'date date' 'kk kk' 'biocum biocum' 'pulterit pulterit' 'sf sf' 'impuls impuls' 'demo demo'; do set -- $${entry}; PROJECT_NAME=$${1} DB_DATABASE=$${2} python manage.py migrate --noinput || exit 1; done && python manage.py compilemessages -l en -l fi -l sv --verbosity 0"
    volumes:
      - .:/code
    environment:
      <<: *web-env
      PROJECT_NAME: date
    depends_on:
      db:
        condition: service_started
      db-init:
        condition: service_completed_successfully

  # Named 'web' so clean_init.sh can run fixtures against it.
  # Uses PROJECT_NAME=date because it's the only association with the ctf app.
  web:
    <<: *web-common
    profiles:
      - all
      - date
    ports:
      - "8002:8000"
    environment:
      <<: *web-env
      PROJECT_NAME: date
      DB_DATABASE: date
      REDIS_SERVER: redis://redis:6379/0

  web-biocum:
    <<: *web-common
    profiles:
      - all
      - biocum
    ports:
      - "8001:8000"
    environment:
      <<: *web-env
      PROJECT_NAME: biocum
      DB_DATABASE: biocum
      REDIS_SERVER: redis://redis:6379/2

  web-kk:
    <<: *web-common
    profiles:
      - all
      - kk
    ports:
      - "8003:8000"
    environment:
      <<: *web-env
      PROJECT_NAME: kk
      DB_DATABASE: kk
      REDIS_SERVER: redis://redis:6379/1

  web-pulterit:
    <<: *web-common
    profiles:
      - all
      - pulterit
    ports:
      - "8004:8000"
    environment:
      <<: *web-env
      PROJECT_NAME: pulterit
      DB_DATABASE: pulterit
      REDIS_SERVER: redis://redis:6379/3

  web-sf:
    <<: *web-common
    profiles:
      - all
      - sf
    ports:
      - "8005:8000"
    environment:
      <<: *web-env
      PROJECT_NAME: sf
      DB_DATABASE: sf
      REDIS_SERVER: redis://redis:6379/4

  web-impuls:
    <<: *web-common
    profiles:
      - all
      - impuls
    ports:
      - "8006:8000"
    environment:
      <<: *web-env
      PROJECT_NAME: impuls
      DB_DATABASE: impuls
      REDIS_SERVER: redis://redis:6379/5

volumes:
  date_postgres_data:
  dev_all_pgadmin_data:
  dev_all_redis_data:
