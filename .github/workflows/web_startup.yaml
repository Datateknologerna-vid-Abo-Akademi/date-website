name: Run unit tests and ping website

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.py'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.dev-all.yml'
      - 'fixtures/**'
      - 'locale/**'
      - 'pyproject.toml'
      - 'scripts/validate_translations.py'
      - 'scripts/clean_init.sh'
      - 'scripts/load_all_fixtures.sh'
      - 'uv.lock'
      - '.env.example'
      - 'env.sh'
      - '.github/workflows/web_startup.yaml'
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.dev-all.yml'
      - 'fixtures/**'
      - 'locale/**'
      - 'pyproject.toml'
      - 'scripts/validate_translations.py'
      - 'scripts/clean_init.sh'
      - 'scripts/load_all_fixtures.sh'
      - 'uv.lock'
      - '.env.example'
      - 'env.sh'
      - '.github/workflows/web_startup.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: 'web-startup-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test_and_ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # The checkout is bind-mounted over /code, so the static trees and .mo
      # files baked into the image are never read. Skip building them.
      BUILD_ASSETS: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            extra_env: ""
          - label: unfold
            extra_env: "-e USE_UNFOLD=True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Try to use prebuilt image
        id: prebuilt
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # PR SHAs have no prebuilt image, and on the first attempt after a
          # push the docker_build workflow is still publishing this SHA. Only a
          # re-run can reuse the published image; a first run always builds.
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.run_attempt }}" -le 1 ]; then
            echo "compose_file=docker-compose.yml" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          REPO_LOWER="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          CI_IMAGE="ghcr.io/${REPO_LOWER}:${GITHUB_SHA}"

          logged_in=0
          for attempt in 1 2 3; do
            if echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin; then
              logged_in=1
              break
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          if [ "${logged_in}" -eq 1 ]; then
            # A re-run can reuse the image published for this SHA; first runs
            # return above. If the pull still fails, fall back to building.
            if docker pull "${CI_IMAGE}"; then
              printf 'services:\n  init:\n    image: %s\n  web:\n    image: %s\n  celery:\n    image: %s\n' "${CI_IMAGE}" "${CI_IMAGE}" "${CI_IMAGE}" > docker-compose.ci.yml
              echo "compose_file=docker-compose.yml:docker-compose.ci.yml" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          echo "compose_file=docker-compose.yml" >> "${GITHUB_OUTPUT}"

      - name: Build image when prebuilt image is unavailable
        if: steps.prebuilt.outputs.compose_file == 'docker-compose.yml'
        run: |
          set -euo pipefail
          # Build every service, including init: `docker compose up` builds the
          # image of any service it cannot find, which used to rebuild the
          # whole Dockerfile a second time in the smoke-test step. Compose
          # deduplicates the identical build config, so this is still one build.
          docker compose build

      - name: Validate translations and compile locale files
        run: |
          set -euo pipefail
          export COMPOSE_FILE="${{ steps.prebuilt.outputs.compose_file }}"
          # Every matrix leg runs on its own runner and the checkout is mounted
          # over /code, which hides the translations compiled into the image,
          # so each leg compiles them for itself.
          docker compose run --rm --no-deps web python scripts/validate_translations.py
          docker compose run --rm --no-deps web python manage.py compilemessages

      - name: Run django unit tests (${{ matrix.label }})
        run: |
          set -euo pipefail
          export COMPOSE_FILE="${{ steps.prebuilt.outputs.compose_file }}"
          # Test settings use in-memory SQLite/Channels/cache, so skip service startup.
          # Parallel workers cut the run to the longest single test; see
          # klotterplanket/tests.py for why module-level skips are avoided.
          docker compose run --rm --no-deps -e TEST=1 ${{ matrix.extra_env }} web python /code/manage.py test --parallel 4

      - name: Build and run Docker Compose
        if: matrix.label == 'default'
        run: |
          set -euo pipefail
          export COMPOSE_FILE="${{ steps.prebuilt.outputs.compose_file }}"
          docker compose up -d

      - name: Wait for web container
        if: matrix.label == 'default'
        run: |
          set -euo pipefail
          export COMPOSE_FILE="${{ steps.prebuilt.outputs.compose_file }}"
          for i in $(seq 1 30); do
            if [ "$(docker compose ps -q web | wc -l)" -eq 1 ] && \
               [ "$(docker inspect -f '{{.State.Running}}' "$(docker compose ps -q web)")" = "true" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Web container did not become healthy in time."
          docker compose ps
          docker compose logs --tail=200 web
          exit 1

      - name: Check HTTP response
        if: matrix.label == 'default'
        run: |
          set -euo pipefail
          # The web container is "running" before Django serves; the retry
          # loop below absorbs the remaining boot time.
          for attempt in $(seq 1 15); do
            if curl --retry 1 --retry-delay 1 --retry-connrefused --retry-all-errors --max-time 8 -sSf http://localhost:8000 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Web endpoint did not become stable in time."
          exit 1

      - name: Print Docker diagnostics on failure
        if: failure() && matrix.label == 'default'
        run: |
          set -euo pipefail
          export COMPOSE_FILE="${{ steps.prebuilt.outputs.compose_file }}"
          docker compose ps
          docker compose logs --tail=200 web db redis

      - name: Tear down containers
        if: always()
        run: |
          set -euo pipefail
          export COMPOSE_FILE="${{ steps.prebuilt.outputs.compose_file }}"
          docker compose down -v

  variant_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      BUILD_ASSETS: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build image
        run: |
          set -euo pipefail
          docker compose build web

      - name: Fresh-process checks and migration graph check
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps web python scripts/check_variants.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use the interpreter the image ships
        run: |
          # The image is the single source of truth for the Python version. Without
          # this, uv installs the newest interpreter the project allows (>=3.14),
          # which can be one the dependencies have no wheels for yet.
          version="$(sed -n 's/^FROM python:\([0-9][0-9.]*\).*/\1/p' Dockerfile | head -n 1)"
          if [ -z "${version}" ]; then
            echo "No python:<version> base image found in Dockerfile" >&2
            exit 1
          fi
          echo "Linting with Python ${version}"
          echo "UV_PYTHON=${version}" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install lint dependencies
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: djlint check
        run: uv run djlint --check templates/

      - name: mypy
        run: uv run mypy .
