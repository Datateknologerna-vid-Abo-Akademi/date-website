name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    # Path filters are not evaluated for tag pushes, so v* tags always run.
    # release_tag.yaml also dispatches this workflow explicitly on the tag ref.
    paths-ignore:
      - 'docs/**'
      - 'charts/**'
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read
  packages: write
  # for the purge-build-cache step (Actions cache delete API)
  actions: write
jobs:
  build:
    if: github.ref_type == 'branch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    concurrency:
      group: 'docker-publish-${{ github.ref_name }}-${{ matrix.arch }}'
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Compute image repository
        id: image
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      - name: Docker login with retry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "GHCR login failed after 3 attempts."
          exit 1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ steps.image.outputs.repo_lower }},push-by-digest=true,name-canonical=true,push=true
          # The image collects static for every association at build time
          # (one tree per variant under /code/static-collected). PROJECT_NAME
          # sets the runtime default only; the chart/compose always pass the
          # site's variant explicitly.
          build-args: |
            PROJECT_NAME=date
          cache-from: type=gha,scope=buildkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=buildkit-${{ matrix.arch }}
      - name: Write digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${DIGEST#sha256:}" > "${RUNNER_TEMP}/digests/digest-${ARCH}.txt"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/digest-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

      # Self-heal the build cache. A corrupt gha cache entry makes every
      # subsequent build fail the same way (2026-08-29: compilemessages
      # SIGILL, exit 132, and a shipped image that crashed at runtime with
      # Illegal instruction on older CPUs). Green builds keep the cache;
      # a failing build purges the buildkit entries so the next run starts
      # clean. The delete-by-key API matches ~30 entries per call, so loop
      # until none are left.
      - name: Purge build cache on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 30); do
            N="$(curl -sS -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=buildkit" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total_count", 0))' 2>/dev/null || echo 0)"
            echo "purged ${N} cache entries"
            [ "${N}" = "0" ] && break
            sleep 2
          done

  merge:
    needs: build
    if: github.ref_type == 'branch' || github.event_name == 'schedule'
    concurrency:
      group: 'docker-publish-${{ github.ref_name }}'
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Compute image repository
        id: image
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      - name: Docker login with retry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "GHCR login failed after 3 attempts."
          exit 1
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Create multi-arch manifest
        env:
          IMAGE_REPO: ghcr.io/${{ steps.image.outputs.repo_lower }}
        run: |
          set -euo pipefail

          TAGS=("${IMAGE_REPO}:${GITHUB_SHA}")
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS+=("${IMAGE_REPO}:qa")
          fi

          TAG_ARGS=()
          for tag in "${TAGS[@]}"; do
            TAG_ARGS+=(--tag "${tag}")
          done

          shopt -s nullglob
          DIGEST_FILES=("${RUNNER_TEMP}"/digests/*.txt)
          if [ "${#DIGEST_FILES[@]}" -ne 2 ]; then
            echo "Expected 2 platform digests, found ${#DIGEST_FILES[@]}."
            exit 1
          fi

          IMAGES=()
          for digest_file in "${DIGEST_FILES[@]}"; do
            IMAGES+=("${IMAGE_REPO}@sha256:$(cat "${digest_file}")")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${IMAGES[@]}"

  tag_release_image:
    concurrency:
      group: 'docker-publish-${{ github.ref_name }}'
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref_type == 'tag'
    defaults:
      run:
        shell: bash
    steps:
      - name: Compute image repository
        id: image
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Docker login with retry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "GHCR login failed after 3 attempts."
          exit 1

      - name: Promote the existing image to release tags
        env:
          IMAGE_REPO: ghcr.io/${{ steps.image.outputs.repo_lower }}
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a SemVer release tag, skipping."
            exit 0
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"

          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          SOURCE_SHA="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          SOURCE_TAG="${IMAGE_REPO}:${SOURCE_SHA}"

          # The release tag workflow creates the git tag after the main build starts.
          # Wait for the SHA-tagged image to exist, then reuse that digest instead of rebuilding.
          for attempt in $(seq 1 24); do
            if docker buildx imagetools inspect "${SOURCE_TAG}" >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 24 ]; then
              echo "Timed out waiting for ${SOURCE_TAG} to exist."
              exit 1
            fi
            sleep 10
          done

          docker buildx imagetools create \
            --tag "${IMAGE_REPO}:${GITHUB_REF_NAME}" \
            --tag "${IMAGE_REPO}:v${MAJOR}.${MINOR}" \
            --tag "${IMAGE_REPO}:v${MAJOR}" \
            --tag "${IMAGE_REPO}:prod" \
            --tag "${IMAGE_REPO}:latest" \
            "${SOURCE_TAG}"
