name: Publish Helm chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/date-website/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CHART_PATH: charts/date-website
      CHART_REGISTRY: oci://ghcr.io/datateknologerna-vid-abo-akademi/charts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Lint chart
        run: |
          set -euo pipefail
          helm lint "${CHART_PATH}" \
            --set django.secretKey=ci-secret-key \
            --set database.password=ci-database-password
          helm lint "${CHART_PATH}" \
            -f "${CHART_PATH}/values-hetzner.yaml" \
            -f "${CHART_PATH}/values-backblaze-b2.example.yaml" \
            --set secret.existingSecret=date-website-ci-secrets \
            --set gateway.https.secretName=date-website-ci-tls \
            --set database.external.host=db.internal \
            --set-string image.tag=v1.9.3 \
            --set-string image.digest=sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          if helm lint "${CHART_PATH}" \
            -f "${CHART_PATH}/values-hetzner.yaml" \
            -f "${CHART_PATH}/values-backblaze-b2.example.yaml" \
            --set secret.existingSecret=date-website-ci-secrets \
            --set gateway.https.secretName=date-website-ci-tls \
            --set database.external.host=db.internal \
            --set-string image.tag=prod; then
            echo "Production lint accepted a moving image tag without a digest."
            exit 1
          fi

      - name: Check migration Job name stays under 63 bytes
        run: |
          set -euo pipefail
          # Kubernetes copies the Job name into a pod-template label
          # (batch.kubernetes.io/job-name); label values are capped at
          # 63 bytes, so an over-long name renders but is rejected by the
          # API server (2026-08-29 regression caught on the cluster).
          name="$(
            helm template ci "${CHART_PATH}" \
              -f "${CHART_PATH}/values-hetzner.yaml" \
              --set secret.existingSecret=ci-secrets \
              --set gateway.https.secretName=ci-tls \
              --set database.external.host=db.internal \
              --set-string image.tag=prod \
              --set-string image.digest=sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
              | awk '/kind: Job/{getline; getline; gsub(/^  name: /, ""); print; exit}'
          )"
          len="${#name}"
          echo "migration Job name: ${name} (${len} bytes)"
          [ "${len}" -le 63 ] || { echo "migration Job name exceeds 63 bytes"; exit 1; }

      - name: Package chart
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "${CHART_PATH}" --destination dist
          CHART_VERSION="$(helm show chart "${CHART_PATH}" | awk '$1 == "version:" { print $2 }')"
          echo "chart_version=${CHART_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "package=dist/date-website-${CHART_VERSION}.tgz" >> "${GITHUB_OUTPUT}"

      - name: Push chart to GHCR
        run: |
          set -euo pipefail
          helm push "${{ steps.package.outputs.package }}" "${CHART_REGISTRY}"
