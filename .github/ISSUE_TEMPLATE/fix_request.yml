name: Maintenance or small fix
description: Request a small correction, cleanup, dependency update, or technical improvement.
title: "chore: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when something mostly works but should be cleaned up or improved.
  - type: textarea
    id: desired
    attributes:
      label: What should change?
      description: Describe the correction or cleanup you want.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current state
      description: What exists now, and why is it worth improving?
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should someone confirm the change is complete?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: This is not a reproducible bug report or a larger feature request.
          required: false
        - label: I searched existing issues and did not find a duplicate.
          required: false
