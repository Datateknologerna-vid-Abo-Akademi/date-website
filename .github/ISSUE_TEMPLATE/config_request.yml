name: Configuration request
description: Request environment, deployment, secret, domain, storage, or service configuration work.
title: "config: "
labels: ["configuration"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste real secrets, passwords, app keys, tokens, private bucket names, or production data into this issue.
  - type: textarea
    id: request
    attributes:
      label: What needs to be configured?
      description: Describe the requested change without including secret values.
      placeholder: Set or update ... so that ...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Variable names, services affected, files, or docs links, if known.
      placeholder: |
        - Variable or setting names:
        - Services affected:
    validations:
      required: false
  - type: textarea
    id: reason
    attributes:
      label: Why is this needed?
      description: Impact, dependency, or deadline, if any.
    validations:
      required: false
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How should we confirm the configuration is correct?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I did not include secret values or private production data.
          required: true
