name: Bug report
description: Report broken or unexpected behavior in the website or tooling.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Describe the problem briefly — repro steps, screenshots, and logs are helpful but not required.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: The page/form/job does X, but I expected Y.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: URLs, commands, or user roles help us reproduce it.
      placeholder: |
        1. Go to ...
        2. Do ...
        3. See ...
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Leave blank if not sure.
      value: |
        - Branch/commit:
        - Browser/device:
        - PROJECT_NAME:
        - Local, staging, or production:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste tracebacks, browser console output, or Celery logs. Remove secrets first.
      render: shell
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images here if helpful.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checks
      options:
        - label: I removed secrets, passwords, tokens, and private production data from this report.
          required: true
