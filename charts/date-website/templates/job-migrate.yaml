{{- if .Values.migrations.job.enabled -}}
{{- $jobName := printf "%s-migrate" (include "date-website.fullname" .) -}}
{{- if not .Values.migrations.job.hook -}}
{{- /*
  Plain Jobs are tracked by GitOps (Argo CD sync waves) and the completed
  Job stays as desired state, so the name must change whenever the image
  changes, or the next sync fails with "field is immutable" (Job pod
  templates are immutable). Helm's Release.Revision does NOT work under
  Argo CD (it always renders as 1).
  Suffix with the sanitized tag + a short hash of the raw tag|digest pair:
  deterministic per image, fresh on image change, collision-safe for tags
  that differ only in characters sanitization collapses (v1.9.4 vs
  v1-9-4). The whole name must stay <= 63 bytes: Kubernetes copies the
  Job name into a pod-template label (batch.kubernetes.io/job-name), and
  label values are capped at 63 bytes. Fall back to just the suffix if the
  fullname would overflow.
*/ -}}
{{- $raw := printf "%s|%s" .Values.image.tag .Values.image.digest -}}
{{- $hash := substr 0 12 (sha256sum $raw) -}}
{{- $tagPart := trimAll "-" (regexReplaceAll "[^a-z0-9-]" (lower .Values.image.tag) "-") -}}
{{- if gt (len $tagPart) 12 }}{{ $tagPart = substr 0 12 $tagPart }}{{ end -}}
{{- $suffix := printf "%s-%s" $tagPart $hash -}}
{{- $jobName = printf "%s-%s" $jobName $suffix -}}
{{- if gt (len $jobName) 63 }}{{ $jobName = printf "migrate-%s" $suffix }}{{ end -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "date-website.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    {{- if .Values.migrations.job.hook }}
    "helm.sh/hook": {{ .Values.migrations.job.hook | quote }}
    "helm.sh/hook-delete-policy": {{ .Values.migrations.job.hookDeletePolicy | quote }}
    {{- end }}
    {{- with .Values.migrations.job.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.job.activeDeadlineSeconds }}
  {{- if and .Values.migrations.job.hook .Values.migrations.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.migrations.job.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "date-website.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "date-website.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "date-website.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -e
              ./wait-for-postgres.sh "${DB_HOST}:${DB_PORT}"
              python /code/manage.py migrate --noinput
              {{- if .Values.media.s3.staticEnabled }}
              # Upload static to the public bucket before application pods
              # start serving S3 URLs (STATIC_S3_ENABLED from the configmap).
              python /code/manage.py collectstatic --noinput
              {{- end }}
          env:
            {{- if .Values.django.alumniSettingsSecretName }}
            - name: ALUMNI_SETTINGS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.alumniSettingsSecretName }}
                  key: ALUMNI_SETTINGS
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "date-website.fullname" . }}
            - secretRef:
                name: {{ include "date-website.secretName" . }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.migrations.job.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
