apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "date-website.fullname" . }}-celery-beat
  labels:
    {{- include "date-website.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-beat
spec:
  replicas: {{ .Values.celeryBeat.replicaCount }}
  selector:
    matchLabels:
      {{- include "date-website.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-beat
  # Zero-downtime rollouts: never take the old pod down until the new one
  # is Ready (same rationale as the celery worker deployment).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "date-website.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-beat
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "date-website.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: celery-beat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -e
              ./wait-for-postgres.sh "${DB_HOST}:${DB_PORT}"
              exec celery -A core beat -l {{ .Values.celeryBeat.logLevel }}
          envFrom:
            - configMapRef:
                name: {{ include "date-website.fullname" . }}
            - secretRef:
                name: {{ include "date-website.secretName" . }}
          # Liveness: beat has no `celery inspect ping` endpoint, so probe
          # the scheduler process itself. Keep the cadence coarse.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "celery -A core beat" >/dev/null
            initialDelaySeconds: {{ .Values.celeryBeat.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.celeryBeat.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.celeryBeat.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.celeryBeat.livenessProbe.failureThreshold }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.celeryBeat.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "date-website.mediaVolumeMount" . | nindent 10 }}
      {{- include "date-website.mediaVolume" . | nindent 6 }}
