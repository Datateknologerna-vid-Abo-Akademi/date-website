{{- if .Values.celery.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "date-website.fullname" . }}-celery
  labels:
    {{- include "date-website.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery
  {{- with .Values.celery.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.celery.replicaCount }}
  selector:
    matchLabels:
      {{- include "date-website.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery
  # Zero-downtime rollouts: never take the old pod down until the new one
  # is Ready. Default maxUnavailable 25% rounds up to 1 with a single
  # replica -> the old pod dies while the new one is still migrating,
  # causing a real outage window on every rollout (2026-08-05).
  strategy:
    {{- toYaml .Values.celery.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "date-website.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "date-website.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.celery.terminationGracePeriodSeconds }}
      containers:
        - name: celery
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -e
              ./wait-for-postgres.sh "${DB_HOST}:${DB_PORT}"
              exec celery -A core worker -l {{ .Values.celery.logLevel }} -c {{ .Values.celery.concurrency }}
          env:
            {{- if .Values.django.alumniSettingsSecretName }}
            - name: ALUMNI_SETTINGS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.alumniSettingsSecretName }}
                  key: ALUMNI_SETTINGS
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "date-website.fullname" . }}
            - secretRef:
                name: {{ include "date-website.secretName" . }}
          # startupProbe gates liveness during slow starts (worker boot +
          # Django import + broker registration). The inspect-ping is
          # expensive (full Django import per attempt) but runs only until
          # the worker is ready, then stops.
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - celery -A core inspect ping -d "celery@${HOSTNAME}" | grep -q OK
            failureThreshold: {{ .Values.celery.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.celery.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.celery.startupProbe.timeoutSeconds }}
          # Liveness is a cheap process check (no Django import, no broker
          # dependency): a broker outage must not restart the worker, since a
          # restart cannot repair the broker. A wedged-but-alive worker is
          # surfaced by queue-depth monitoring instead.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - kill -0 1
            initialDelaySeconds: 10
            periodSeconds: {{ .Values.celery.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.celery.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.celery.livenessProbe.failureThreshold }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.celery.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "date-website.mediaVolumeMount" . | nindent 10 }}
      {{- include "date-website.mediaVolume" . | nindent 6 }}
{{- end }}
