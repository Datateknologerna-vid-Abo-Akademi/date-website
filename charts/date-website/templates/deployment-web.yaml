apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "date-website.fullname" . }}-web
  labels:
    {{- include "date-website.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "date-website.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  # Zero-downtime rollouts: never take the old pod down until the new one
  # is Ready. Default maxUnavailable 25% rounds up to 1 with a single
  # replica -> the old pod dies while the new one is still migrating,
  # causing a real outage window on every rollout (2026-08-05).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "date-website.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "date-website.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -e
              ./wait-for-postgres.sh "${DB_HOST}:${DB_PORT}"
              {{- if .Values.web.migrateOnStartup }}
              python /code/manage.py migrate --noinput
              {{- end }}
              {{- if .Values.web.collectstaticOnStartup }}
              python /code/manage.py collectstatic --noinput
              {{- end }}
              exec gunicorn \
                -w {{ .Values.web.gunicorn.workers }} \
                --timeout {{ .Values.web.gunicorn.timeout }} \
                --max-requests {{ .Values.web.gunicorn.maxRequests }} \
                --max-requests-jitter {{ .Values.web.gunicorn.maxRequestsJitter }} \
                --bind=0.0.0.0:8000 \
                core.wsgi
          env:
            {{- if .Values.django.alumniSettingsSecretName }}
            - name: ALUMNI_SETTINGS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.django.alumniSettingsSecretName }}
                  key: ALUMNI_SETTINGS
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "date-website.fullname" . }}
            - secretRef:
                name: {{ include "date-website.secretName" . }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # startupProbe gates liveness during slow starts (migrateOnStartup
          # cold boot: wait-for-postgres + migrate + collectstatic can exceed
          # 2 min under the web CPU limit; a 30x2s budget is too tight because
          # refused probes fail instantly -> ~60s floor). 90x2s = ~180s floor,
          # measured after the 2026-08-07 worker-reboot incident.
          startupProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "date-website.probeHost" . | quote }}
            failureThreshold: 90
            periodSeconds: 2
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "date-website.probeHost" . | quote }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz/
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "date-website.probeHost" . | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "date-website.mediaVolumeMount" . | nindent 10 }}
      {{- include "date-website.mediaVolume" . | nindent 6 }}
