
image:
  repository: ghcr.io/datateknologerna-vid-abo-akademi/date-website
  tag: prod
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations: {}
podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
nodeSelector: {}
tolerations: []
affinity: {}
secret:
  existingSecret: ''
  extraEnv: {}
django:
  projectName: date
  secretKey: ''
  debug: false
  develop: false
  enableLanguageFeatures: false
  allowedHosts:
  - datateknologerna.org
  allowedOrigins:
  - https://datateknologerna.org
  useXForwardedHost: true
  trustXForwardedProto: true
  extraStaffGroups: []
  alumniSettings: '{}'
  alumniSettingsSecretName: ''
  turnstile:
    siteKey: ''
    secretKey: ''
  github:
    clientId: ''
    clientSecret: ''
    mfaPolicy: enrolled
database:
  name: postgres
  username: postgres
  password: ''
  external:
    host: ''
    port: 5432
postgresql:
  enabled: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClass: ''
    accessModes:
    - ReadWriteOnce
    size: 8Gi
  resources: {}
backups:
  enabled: false
  schedule: 17 2 * * *
  retentionDays: 14
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClass: ''
    accessModes:
    - ReadWriteOnce
    size: 8Gi
  objectStorage:
    enabled: false
    endpointUrl: ''
    regionName: ''
    bucketName: ''
    prefix: date-website/postgresql
    accessKeyId: ''
    secretAccessKey: ''
    installAwsCli: false
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    runAsUser: 999
    runAsGroup: 999
  podSecurityContext:
    fsGroup: 999
  resources: {}
redis:
  enabled: true
  externalUrl: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    repository: valkey/valkey
    tag: 7.2-alpine
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClass: ''
    accessModes:
    - ReadWriteOnce
    size: 1Gi
  resources: {}
media:
  s3:
    enabled: false
    endpointUrl: ''
    regionName: ''
    signatureVersion: s3v4
    addressingStyle: path
    accessKeyId: ''
    secretAccessKey: ''
    bucketName: ''
    privateBucketName: ''
    publicBucketName: ''
    privateLocation: date/media
    publicLocation: date/public
    # Optional custom media domains (host only, no scheme) served by a reverse proxy
    # (e.g. a Cloudflare Worker) that forwards to the S3 endpoint, rewriting the Host
    # header to the S3 endpoint host and preserving path + query. Public media uses
    # unsigned URLs; private media URLs stay presigned with only the host swapped.
    # Leave empty to keep endpoint URLs.
    privateCustomDomain: ''
    publicCustomDomain: ''
    # Direct browser-to-storage uploads (Uppy with presigned PUT URLs). Requires
    # bucket CORS + a lifecycle rule on the tmp prefix (see docs/dev/uploads.md);
    # uploads then bypass the web pods entirely.
    directUploadsEnabled: false
  persistence:
    enabled: true
    storageClass: ''
    accessModes:
    - ReadWriteOnce
    size: 5Gi
email:
  hostReceiver: info@datateknologerna.org
  defaultFrom: admin@datateknologerna.org
  host: smtp.gmail.com
  username: ''
  password: ''
web:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  gunicorn:
    workers: 3
    timeout: 120
    maxRequests: 1000
    maxRequestsJitter: 100
  migrateOnStartup: false
  # False by default: images are built with collectstatic already run
  # (PROJECT_NAME=date unless built per association). Enable only when the
  # deployed image was not built with this variant's PROJECT_NAME.
  collectstaticOnStartup: false
  resources: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
asgi:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  wsPath: /ws
  resources: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
celery:
  replicaCount: 1
  concurrency: 2
  logLevel: info
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 300
    timeoutSeconds: 30
    failureThreshold: 3
  resources: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
migrations:
  job:
    enabled: false
    hook: post-install,post-upgrade
    hookDeletePolicy: before-hook-creation,hook-succeeded
    backoffLimit: 3
    resources: {}
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
  - host: datateknologerna.org
    paths:
    - path: /
      pathType: Prefix
  tls: []
gateway:
  enabled: false
  className: traefik
  name: ''
  annotations: {}
  http:
    enabled: true
    port: 80
  https:
    enabled: false
    port: 443
    secretName: ''
  route:
    annotations: {}
extraEnv: {}
