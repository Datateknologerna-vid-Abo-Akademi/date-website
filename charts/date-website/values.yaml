
image:
  repository: ghcr.io/datateknologerna-vid-abo-akademi/date-website
  tag: prod
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations: {}
podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
nodeSelector: {}
tolerations: []
affinity: {}
secret:
  existingSecret: ''
  extraEnv: {}
django:
  projectName: date
  secretKey: ''
  debug: false
  develop: false
  enableLanguageFeatures: false
  allowedHosts:
  - datateknologerna.org
  allowedOrigins:
  - https://datateknologerna.org
  useXForwardedHost: true
  trustXForwardedProto: true
  extraStaffGroups: []
  alumniSettings: '{}'
  alumniSettingsSecretName: ''
  turnstile:
    siteKey: ''
    secretKey: ''
  github:
    clientId: ''
    clientSecret: ''
    mfaPolicy: enrolled
database:
  name: postgres
  username: postgres
  password: ''
  external:
    host: ''
    port: 5432
postgresql:
  enabled: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClass: ''
    accessModes:
    - ReadWriteOnce
    size: 8Gi
  resources: {}
backups:
  enabled: false
  schedule: 17 2 * * *
  retentionDays: 14
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClass: ''
    accessModes:
    - ReadWriteOnce
    size: 8Gi
  objectStorage:
    enabled: false
    endpointUrl: ''
    regionName: ''
    bucketName: ''
    prefix: date-website/postgresql
    accessKeyId: ''
    secretAccessKey: ''
    installAwsCli: false
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    runAsUser: 999
    runAsGroup: 999
  podSecurityContext:
    fsGroup: 999
  resources: {}
redis:
  enabled: true
  externalUrl: ''
  nodeSelector: {}
  tolerations: []
  affinity: {}
  image:
    repository: valkey/valkey
    tag: 7.2-alpine
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClass: ''
    accessModes:
    - ReadWriteOnce
    size: 1Gi
  resources: {}
media:
  s3:
    enabled: false
    endpointUrl: ''
    regionName: ''
    signatureVersion: s3v4
    addressingStyle: path
    accessKeyId: ''
    secretAccessKey: ''
    bucketName: ''
    privateBucketName: ''
    publicBucketName: ''
    privateLocation: date/media
    publicLocation: date/public
    # Optional custom media domains (host only, no scheme) served by a reverse proxy
    # (e.g. a Cloudflare Worker) that forwards to the S3 endpoint, rewriting the Host
    # header to the S3 endpoint host and preserving path + query. Public media uses
    # unsigned URLs; private media URLs stay presigned with only the host swapped.
    # Leave empty to keep endpoint URLs.
    privateCustomDomain: ''
    publicCustomDomain: ''
    # Direct browser-to-storage uploads (Uppy with presigned PUT URLs). Requires
    # bucket CORS + a lifecycle rule on the tmp prefix (see docs/dev/uploads.md);
    # uploads then bypass the web pods entirely.
    directUploadsEnabled: false
  persistence:
    enabled: true
    storageClass: ''
    accessModes:
    - ReadWriteOnce
    size: 5Gi
email:
  hostReceiver: info@datateknologerna.org
  defaultFrom: admin@datateknologerna.org
  host: smtp.gmail.com
  username: ''
  password: ''
web:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  gunicorn:
    workers: 3
    timeout: 120
    # On SIGTERM gunicorn waits this long for in-flight requests before
    # killing workers; must fit inside terminationGracePeriodSeconds.
    gracefulTimeout: 120
    maxRequests: 1000
    maxRequestsJitter: 100
  migrateOnStartup: false
  # Graceful shutdown: the preStop sleep gives the ingress time to observe
  # endpoint termination and stop routing new requests; the grace period
  # then covers gunicorn's graceful timeout.
  terminationGracePeriodSeconds: 130
  preStopSleepSeconds: 5
  # Every variant's static is collected into the image at build time
  # (/code/static-collected/<PROJECT_NAME>), so pods do not collect at
  # startup. Keep this flag for images built before the multi-tree layout.
  collectstaticOnStartup: false
  startupProbe:
    # 90x2s = ~180s floor, measured after the 2026-08-07 worker-reboot
    # incident. Tighten once migrate/collectstatic are off (date site: 30x2s).
    failureThreshold: 90
    periodSeconds: 2
    timeoutSeconds: 5
  # Merged onto the Deployment metadata (e.g.
  # argocd.argoproj.io/sync-wave: "1" to run after the migration Job).
  annotations: {}
  resources: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
asgi:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  wsPath: /ws
  # The preStop sleep gives the ingress time to stop routing new
  # connections; Daphne closes remaining WebSockets on SIGTERM, and the
  # grace period covers that shutdown. A longer drain would require an
  # application-level drain hook, which Daphne does not provide.
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  # Merged onto the Deployment metadata (e.g.
  # argocd.argoproj.io/sync-wave: "1" to run after the migration Job).
  annotations: {}
  resources: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
celery:
  replicaCount: 1
  concurrency: 2
  logLevel: info
  # Warm shutdown: celery finishes active tasks on SIGTERM and (with
  # task_acks_late) requeues acknowledged-but-unfinished work on worker
  # loss; the grace period is the floor and should exceed the longest
  # task. The 120s default is a starting point; verify against task
  # durations and adjust.
  terminationGracePeriodSeconds: 120
  # Merged onto the Deployment metadata (e.g.
  # argocd.argoproj.io/sync-wave: "1" to run after the migration Job).
  annotations: {}
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 300
    timeoutSeconds: 30
    failureThreshold: 3
  resources: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
migrations:
  job:
    enabled: false
    # Helm hook lifecycle (post-install,post-upgrade), or empty for a plain
    # Job tracked by GitOps. Plain Jobs get a revision-suffixed name and run
    # under Argo sync waves, which guarantees migration completion before
    # application pods start; they must NOT set ttlSecondsAfterFinished,
    # because Argo keeps the completed Job as desired state.
    hook: post-install,post-upgrade
    hookDeletePolicy: before-hook-creation,hook-succeeded
    backoffLimit: 3
    # Additional annotations merged onto the Job (e.g.
    # argocd.argoproj.io/sync-wave: "0").
    annotations: {}
    activeDeadlineSeconds: 600
    # Only rendered in hook mode; plain Jobs stay until Argo prunes them.
    ttlSecondsAfterFinished: 3600
    resources: {}
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
  - host: datateknologerna.org
    paths:
    - path: /
      pathType: Prefix
  tls: []
gateway:
  enabled: false
  className: traefik
  name: ''
  annotations: {}
  http:
    enabled: true
    port: 80
  https:
    enabled: false
    port: 443
    secretName: ''
  route:
    annotations: {}
extraEnv: {}
