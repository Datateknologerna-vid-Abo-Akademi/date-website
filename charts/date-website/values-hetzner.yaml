ingress:
  enabled: false

gateway:
  enabled: true
  className: traefik
  https:
    enabled: true

web:
  # Migration is handled by the plain migration Job below (Argo sync wave 0),
  # so the web deployment must not migrate: multiple replicas or a restart
  # would otherwise race or re-run migrations.
  replicaCount: 1
  migrateOnStartup: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

asgi:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

celery:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
    limits:
      memory: 768Mi

migrations:
  job:
    enabled: true
    # Plain Job (no Helm hook) so Argo sync waves order it before the
    # application deployments; set the same waves on web/asgi/celery in the
    # operator values.
    hook: ""
    annotations:
      argocd.argoproj.io/sync-wave: "0"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi

postgresql:
  enabled: false
  persistence:
    storageClass: hcloud-volumes
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

backups:
  enabled: true
  schedule: "17 2 * * *"
  retentionDays: 14
  persistence:
    storageClass: hcloud-volumes
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

redis:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

media:
  persistence:
    storageClass: hcloud-volumes
    size: 10Gi
