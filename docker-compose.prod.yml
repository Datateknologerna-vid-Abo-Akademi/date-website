services:
  db:
    image: postgres:${DATE_POSTGRESQL_VERSION}-alpine
    restart: always
    entrypoint:
      - /bin/sh
      - /scripts/postgres-entrypoint.sh
    volumes:
      - date_postgres_data:/var/lib/postgresql/data/
      - ./scripts/postgres-entrypoint.sh:/scripts/postgres-entrypoint.sh:ro
    environment:
      POSTGRES_PASSWORD: ${DATE_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - internal
  web:
    env_file: .env
    image: ghcr.io/datateknologerna-vid-abo-akademi/date-website:${DATE_IMG_TAG}
    restart: always
    command: /bin/bash -c "./wait-for-postgres.sh db:5432 && python /code/manage.py migrate --noinput && exec gunicorn -k uvicorn_worker.UvicornWorker -w 3 --timeout 120 --max-requests 0 --max-requests-jitter 0 --bind=0.0.0.0 core.asgi:application"
    environment:
      # ASGI web: close DB connections at request end (each request runs on
      # a per-request thread, so persistent connections leak). Takes
      # precedence over DB_CONN_MAX_AGE from .env.
      DB_CONN_MAX_AGE: "0"
    depends_on:
      - db
      - redis
    networks:
      - internal
  celery:
    env_file: .env
    restart: always
    image: ghcr.io/datateknologerna-vid-abo-akademi/date-website:${DATE_IMG_TAG}
    command: celery -A core worker -l info -c 2
    depends_on:
      - db
      - redis
    networks:
        - internal
  redis:
    restart: always
    image: valkey/valkey:7.2-alpine
    networks:
      - internal
    volumes:
      - redis_data:/data
  nginx:
    restart: always
    image: nginx:stable-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - internal
      - web
    depends_on:
      - web
      - redis

volumes:
  date_postgres_data:
  redis_data:

networks:
    internal:
    web:
      external: true
