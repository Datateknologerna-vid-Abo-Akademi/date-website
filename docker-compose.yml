services:
  db:
    image: postgres:${DATE_POSTGRESQL_VERSION}-alpine
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /scripts/postgres-entrypoint.sh
    volumes:
      - date_postgres_data:/var/lib/postgresql/data/
      - ./scripts/postgres-entrypoint.sh:/scripts/postgres-entrypoint.sh:ro
    environment:
      POSTGRES_PASSWORD: ${DATE_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles:
      - pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-password}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
  # Runs once per stack creation: waits for PostgreSQL, migrates, and compiles
  # translations. The web service starts only after this succeeds.
  # collectstatic is skipped: debug mode serves static from STATICFILES_DIRS.
  # After pulling code with new migrations, run `date-migrate` (or recreate the
  # stack) to apply them.
  init:
    env_file: .env
    build: .
    restart: "no"
    command: /bin/bash -c "./wait-for-postgres.sh db:5432 && python manage.py migrate --noinput && python manage.py compilemessages -l en -l fi -l sv --verbosity 0"
    volumes:
      - .:/code
    depends_on:
      - db
  web:
    env_file: .env
    build: .
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - ${DATE_DJANGO_PORT}:8000
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
  celery:
    env_file: .env
    restart: unless-stopped
    build: .
    command: celery -A core worker -l info -c 2
    volumes:
      - .:/code
    depends_on:
      - web
      - redis
  redis:
    restart: unless-stopped
    image: valkey/valkey:7.2-alpine
    volumes:
      - redis_data:/data
      
volumes:
  date_postgres_data:
  pgadmin_data:
  redis_data:
