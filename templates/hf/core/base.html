{% extends "core/base.html" %}
{% load static %}
{% block fonts %}
  {% comment %}
    The association's own pairing, taken from its current website: Sansita for
    headings, Nunito Sans for everything else. Both are on Google Fonts.
  {% endcomment %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&amp;family=Sansita:wght@400;700&amp;display=swap"
        rel="stylesheet">
{% endblock %}
{% block favicon %}
  <link rel="icon"
        type="image/png"
        href="{% static 'core/images/favicon.png' %}"
        sizes="180x180">
  <link rel="apple-touch-icon" href="{% static 'core/images/favicon.png' %}">
{% endblock %}
