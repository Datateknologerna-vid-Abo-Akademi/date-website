{% load i18n otp_webauthn %}
<div class="passkey-login">
  <input type="hidden"
         name="next"
         value="{% if redirect_field_value %}{{ redirect_field_value }}{% else %}{{ request.GET.next|default:'' }}{% endif %}">
  <span id="passkey-verification-placeholder"></span>
  <template id="passkey-verification-available-template">
    <button type="button" id="passkey-verification-button" class="passkey-button">
      <span class="passkey-button__icon" aria-hidden="true">
        <svg width="20"
             height="20"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round"
             xmlns="http://www.w3.org/2000/svg">
          <circle cx="7.5" cy="15.5" r="4.5" />
          <path d="M10.7 12.3 21 2m-4 4 3 3m-6-1 2 2" />
        </svg>
      </span>
      <span>{% trans "Sign in with a passkey" %}</span>
    </button>
    <div id="passkey-verification-status-message"
         class="passkey-status"
         role="alert"></div>
  </template>
  <template id="passkey-verification-unavailable-template">
    <p class="passkey-unavailable">{% trans "This browser does not support passkeys." %}</p>
  </template>
  {% render_otp_webauthn_auth_scripts username_field_selector="input[name='auth-username']" %}
</div>
