<script id="custom" defer>
        // element with id "calendar_json" is populated by django as defined in views.py context object
        const calendarScript = document.querySelector('script#calendar_json');
        const events_json = calendarScript ? JSON.parse(calendarScript.textContent) : {};

        const isValidInternalUrl = (url) => {
            if (typeof url !== 'string' || !url) return false;
            const trimmedUrl = url.trim();
            if (trimmedUrl.startsWith('//')) return false;

            const lowerUrl = trimmedUrl.toLowerCase();
            if (lowerUrl.startsWith('javascript:') || lowerUrl.startsWith('data:') || lowerUrl.startsWith('vbscript:')) {
                return false;
            }

            if (trimmedUrl.startsWith('/') && !trimmedUrl.startsWith('//')) {
                return true;
            }

            try {
                const urlObj = new URL(trimmedUrl, window.location.origin);
                return urlObj.origin === window.location.origin;
            } catch (e) {
                return false;
            }
        };

        Object.entries(events_json).forEach(([dateKey, dayEvents])=>{
            const links = dayEvents.map((event) => {
                const tempDate = new Date(event.eventFullDate);
                let hours = tempDate.getHours();
                let minutes = tempDate.getMinutes();
                // Ensure hours and minutes are displayed with two digits
                hours = hours < 10 ? '0' + hours : hours;
                minutes = minutes < 10 ? '0' + minutes : minutes;
                const rawUrl = (event.link || '').trim();

                const link = document.createElement('a');
                link.className = "calendar-eventday-popup";

                if (isValidInternalUrl(rawUrl)) {
                    try {
                        const urlObj = new URL(rawUrl, window.location.origin);
                        if (urlObj.origin === window.location.origin) {
                            link.href = urlObj.href;
                        } else {
                            link.href = '#';
                        }
                    } catch (e) {
                        link.href = '#';
                    }
                } else {
                    link.href = '#';
                }

                link.appendChild(document.createTextNode(`${hours}:${minutes}`));
                link.appendChild(document.createElement('br'));
                link.appendChild(document.createTextNode(event.eventTitle));

                return link.outerHTML;
            });

            events_json[dateKey] = {
                modifier: "calendar-eventday",
                html: links.join('<br>'),
                events: dayEvents,
            };
        });

        // Select all elements with class 'calendar' and initialize the calendar on each.
        // vanilla-calendar 3.x exposes its constructor as Calendar on the
        // VanillaCalendarPro global, and takes its options flat rather than nested
        // under a settings key.
        document.querySelectorAll('.calendar').forEach(calendarElement => {
            const calendarPopups = new VanillaCalendarPro.Calendar(calendarElement, {
                onClickDate(self, event) {
                    // 3.x runs this before it updates its own selectedDates, so read the
                    // day from the clicked cell instead. The cell carries the date as an
                    // ISO key, which is the same key the payload is built with.
                    const target = event && event.target;
                    const cell = target && target.closest ? target.closest('[data-vc-date]') : null;
                    const dateKey = cell && cell.getAttribute('data-vc-date');
                    const day = dateKey ? events_json[dateKey] : undefined;
                    if (day !== undefined && day.events.length === 1) {
                        const rawUrl = (day.events[0].link || '').trim();
                        if (isValidInternalUrl(rawUrl)) {
                            try {
                                const safeUrl = new URL(rawUrl, window.location.origin);
                                if (safeUrl.origin === window.location.origin) {
                                    window.location.href = safeUrl.href;
                                }
                            } catch (e) {
                                // Fallback or silent fail
                            }
                        }
                    }
                },
                selectedMonth: new Date().getMonth(),
                selectedYear: new Date().getFullYear(),
                popups: events_json
            });
            calendarPopups.init();
        });
</script>
