{% extends "core/footer.html" %}
{% load static %}
{% load i18n %}
{% block footer_logo %}
  <img class="footer-img img-fluid"
       alt="{{ ASSOCIATION_NAME_FULL }} logo"
       src="{% static 'core/images/impuls-logo-transparent.png' %}">
{% endblock %}
{% block footer_right %}
  <div class="col-12 col-md-4 text-center footer-partner-logo">
    <a class="partner-link"
       href="https://www.abo.fi/utbildningsprogram/psykologi/"
       target="_blank"
       rel="noopener"
       aria-label="{% trans 'Åbo Akademi – psykologi' %}">{% include "svg/abo_akademi.svg" %}</a>
  </div>
{% endblock %}
{% block extra_footer %}
  {% include "core/partials/date_credit.html" %}
{% endblock %}
